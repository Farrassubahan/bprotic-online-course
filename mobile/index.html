<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPROTIC - Silabus Mobile Development</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Highlight.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .hero-section-mobile {
            padding: 140px 0 60px;
            background: radial-gradient(circle at center, #2e1065 0%, #0f172a 100%);
            border-bottom: 1px solid var(--border-color);
        }
        .text-gradient-mobile {
            background: linear-gradient(to right, #a855f7, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-framework-btn {
            border: 1px solid #475569;
            color: #94a3b8;
            font-size: 0.82rem;
            padding: 4px 12px;
            border-radius: 20px;
            transition: all 0.2s ease;
            cursor: pointer;
            background: #1e293b;
        }
        .nav-framework-btn:hover {
            color: #fff;
            border-color: #a855f7;
        }
        .nav-framework-btn.active {
            background: linear-gradient(135deg, #7c3aed, #6366f1);
            color: #fff;
            border-color: #a855f7;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.4);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-glass fixed-top border-bottom border-secondary py-2">
        <div class="container px-4">
            <a class="navbar-brand d-flex align-items-center text-decoration-none" href="../index.html">
                <img src="../assets/logo-bprotic.png" alt="BPROTIC Logo" style="height: 46px; background-color: rgba(255, 255, 255, 0.95); padding: 5px 10px; border-radius: 10px;" class="me-3 shadow-sm">
                <div class="d-flex flex-column">
                    <span class="text-gradient-mobile fw-bold" style="font-size: 1.15rem; letter-spacing: -0.5px; line-height: 1.2;">BPROTIC COURSE</span>
                    <div>
                        <span class="badge px-2 py-0" style="background: linear-gradient(135deg, #7c3aed, #6366f1); font-size: 9px; letter-spacing: 0.5px; color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; display: inline-block;">MOBILE TRACK</span>
                    </div>
                </div>
            </a>
            
            <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-2 mt-3 mt-lg-0">
                    <!-- Quick Switch Buttons: Tetap sejajar horizontal (side-by-side) -->
                    <div class="d-flex flex-row align-items-center justify-content-center gap-2">
                        <a href="../web/index.html" class="btn btn-outline-info btn-sm rounded-pill px-3 py-1 text-nowrap flex-grow-1 flex-lg-grow-0 d-flex align-items-center justify-content-center">
                            <i class="bi bi-globe me-1"></i> Ke Silabus Web
                        </a>
                        <a href="../index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3 py-1 text-nowrap flex-grow-1 flex-lg-grow-0 d-flex align-items-center justify-content-center">
                            <i class="bi bi-house me-1"></i> Beranda
                        </a>
                    </div>
                    
                    <!-- Dropdown Pertemuan -->
                    <div class="ms-lg-2">
                        <select id="weekSelector" class="form-select form-select-sm bg-dark text-light border-secondary shadow-sm" style="min-width: 260px;">
                            <option value="1" selected>Pertemuan 1: Setup & Dasar TypeScript</option>
                            <option value="2">Pertemuan 2: UI, State & Interaction</option>
                            <option value="3">Pertemuan 3: Navigation & Multi Page</option>
                            <option value="4">Pertemuan 4: Component & Struktur Code</option>
                            <option value="5">Pertemuan 5: CRUD Lokal & Local Storage</option>
                            <option value="6">Pertemuan 6: HTTP & Consume REST API</option>
                            <option value="7">Pertemuan 7: CRUD melalui REST API</option>
                            <option value="8">Pertemuan 8: Relasi Data & API Integration</option>
                            <option value="9">Pertemuan 9: Search, Filter & Feedback</option>
                            <option value="10">Pertemuan 10: Finalisasi & Build APK</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header Banner -->
    <div class="hero-section-mobile text-center">
        <div class="container">
            <div class="d-flex justify-content-center align-items-center gap-2 mb-3">
                <span class="badge fs-6 px-3 py-2 rounded-pill" style="background-color: #7c3aed;" id="heroBadge">Pertemuan 1</span>
                <!-- Framework Selector Pill -->
                <div class="d-inline-flex bg-dark p-1 rounded-pill border border-secondary" id="frameworkSwitchContainer">
                    <button type="button" class="nav-framework-btn active" data-framework="react-native" id="btnReact">
                        <i class="bi bi-phone me-1"></i> React Native (Expo)
                    </button>
                    <button type="button" class="nav-framework-btn" data-framework="ionic" id="btnIonic">
                        <i class="bi bi-lightning-charge me-1"></i> Ionic Framework
                    </button>
                </div>
            </div>
            
            <h1 class="display-4 fw-bold text-white mb-3" id="heroTitle">Setup React Native, Expo & Dasar TypeScript</h1>
            <p class="lead text-light-50 mx-auto" id="heroSubtitle" style="max-width: 680px;">
                Instalasi Node.js & Expo, struktur project Expo, sintaks TypeScript, serta pembuatan komponen pertama aplikasi mobile.
            </p>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">
                <div id="contentArea" class="content-wrapper">
                    <!-- Content injected via JS -->
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 text-light-50 border-top border-secondary mt-5">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
            <p class="mb-0">© 2026 BPROTIC - Divisi Mobile Development</p>
            <div>
                <a href="../web/index.html" class="text-info text-decoration-none small me-3"><i class="bi bi-globe me-1"></i>Track Web</a>
                <a href="../index.html" class="text-secondary text-decoration-none small"><i class="bi bi-grid me-1"></i>Portal Silabus</a>
            </div>
        </div>
    </footer>  

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Data & Mobile Engine -->
    <script src="data.js"></script>
    <script>
        let currentFramework = "react-native";
        let activeWeek = "1";

        document.addEventListener("DOMContentLoaded", () => {
            const weekSelector = document.getElementById("weekSelector");
            const btnReact = document.getElementById("btnReact");
            const btnIonic = document.getElementById("btnIonic");

            // Event Framework Switch
            btnReact.addEventListener("click", () => switchFramework("react-native"));
            btnIonic.addEventListener("click", () => switchFramework("ionic"));

            // Initial Render
            renderMobileContent(activeWeek);

            weekSelector.addEventListener("change", (e) => {
                const val = e.target.value;
                const fwData = mobileData[currentFramework];
                const weekInfo = fwData.weeks[val];
                
                if (weekInfo && weekInfo.content) {
                    activeWeek = val;
                    renderMobileContent(val);
                } else {
                    const weekTitle = weekInfo ? weekInfo.title : `Pertemuan ${val}`;
                    const weekSub = weekInfo ? weekInfo.subtitle : 'Materi sedang dalam proses penyusunan.';
                    const fwName = fwData.metadata.name;
                    
                    Swal.fire({
                        icon: 'info',
                        title: 'Segera Hadir!',
                        html: `Materi untuk <b>Pertemuan ${val}: ${weekTitle}</b> (${fwName}) sedang dalam proses penyusunan.<br><br><span class="text-info">${weekSub}</span><br><br>Stay tuned!`,
                        confirmButtonText: 'Oke, Mengerti',
                        confirmButtonColor: '#7c3aed',
                        background: '#1e293b',
                        color: '#f8fafc',
                        showClass: {
                            popup: 'animate__animated animate__zoomIn'
                        },
                        hideClass: {
                            popup: 'animate__animated animate__zoomOut'
                        }
                    });
                    
                    weekSelector.value = activeWeek;
                }
            });
        });

        function switchFramework(fw) {
            currentFramework = fw;
            document.querySelectorAll(".nav-framework-btn").forEach(btn => {
                if (btn.dataset.framework === fw) {
                    btn.classList.add("active");
                } else {
                    btn.classList.remove("active");
                }
            });

            // Update dropdown labels
            updateDropdownLabels();

            // Render current week
            renderMobileContent(activeWeek);
        }

        function updateDropdownLabels() {
            const weekSelector = document.getElementById("weekSelector");
            const fwData = mobileData[currentFramework];
            
            for (let i = 1; i <= 10; i++) {
                const opt = weekSelector.querySelector(`option[value="${i}"]`);
                if (opt && fwData.weeks[i]) {
                    opt.textContent = `Pertemuan ${i}: ${fwData.weeks[i].title}`;
                }
            }
        }

        function renderMobileContent(weekId) {
            const fwData = mobileData[currentFramework];
            const data = fwData.weeks[weekId];
            if (!data) return;

            // Update Header
            document.getElementById("heroBadge").textContent = `Pertemuan ${weekId}`;
            document.getElementById("heroTitle").textContent = data.title;
            if (document.getElementById("heroSubtitle")) {
                document.getElementById("heroSubtitle").textContent = data.subtitle;
            }
            
            // Update Content dengan animasi fade
            const contentArea = document.getElementById("contentArea");
            contentArea.style.opacity = 0;
            
            setTimeout(() => {
                contentArea.innerHTML = data.content || `
                    <div class="text-center py-5">
                        <i class="bi bi-clock-history fs-1 text-warning mb-3"></i>
                        <h3 class="text-white fw-bold">Pertemuan ${weekId}: ${data.title}</h3>
                        <p class="text-light-50">${data.subtitle}</p>
                        <span class="badge bg-secondary p-2">Materi Praktik Sedang Disiapkan</span>
                    </div>
                `;
                
                // Highlight code blocks
                document.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
                
                contentArea.style.opacity = 1;
                contentArea.style.transition = "opacity 0.4s ease-in-out";
            }, 180);
        }
    </script>
</body>
</html>
