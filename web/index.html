<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Highlight.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">

</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-glass fixed-top border-bottom border-secondary py-2">
        <div class="container px-4">
            <a class="navbar-brand d-flex align-items-center text-decoration-none" href="../index.html">
                <img src="../assets/logo-bprotic.png" alt="BPROTIC Logo" style="height: 46px; background-color: rgba(255, 255, 255, 0.95); padding: 5px 10px; border-radius: 10px;" class="me-3 shadow-sm">
                <div class="d-flex flex-column">
                    <span class="text-gradient fw-bold" style="font-size: 1.15rem; letter-spacing: -0.5px; line-height: 1.2;">BPROTIC COURSE</span>
                    <div>
                        <span class="badge px-2 py-0" style="background: linear-gradient(135deg, #0284c7, #38bdf8); font-size: 9px; letter-spacing: 0.5px; color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; display: inline-block;">WEB TRACK</span>
                    </div>
                </div>
            </a>
            
            <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-2 mt-3 mt-lg-0">
                    <!-- Quick Switch Buttons: Tetap sejajar horizontal (side-by-side) -->
                    <div class="d-flex flex-row align-items-center justify-content-center gap-2">
                        <a href="../mobile/index.html" class="btn btn-outline-info btn-sm rounded-pill px-3 py-1 text-nowrap flex-grow-1 flex-lg-grow-0 d-flex align-items-center justify-content-center">
                            <i class="bi bi-phone me-1"></i> Ke Silabus Mobile
                        </a>
                        <a href="../index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3 py-1 text-nowrap flex-grow-1 flex-lg-grow-0 d-flex align-items-center justify-content-center">
                            <i class="bi bi-house me-1"></i> Beranda
                        </a>
                    </div>
                    
                    <!-- Dropdown Pertemuan & Theme Toggle -->
                    <div class="d-flex align-items-center gap-2 ms-lg-2">
                        <select id="weekSelector" class="form-select form-select-sm bg-dark text-light border-secondary shadow-sm" style="min-width: 250px;">
                            <option value="1" selected>Pertemuan 1: Setup & Dasar PHP</option>
                            <option value="2">Pertemuan 2: Logic, Form Handling & Database</option>
                            <option value="3">Pertemuan 3: CRUD PHP</option>
                            <option value="4">Pertemuan 4: OOP & MVC Dasar</option>
                            <option value="5">Pertemuan 5: Pengenalan Laravel</option>
                            <option value="6">Pertemuan 6: Laravel CRUD & Eloquent</option>
                            <option value="7">Pertemuan 7: REST API Laravel</option>
                            <option value="8">Pertemuan 8: Relasi, Validasi & API Testing</option>
                            <option value="9">Pertemuan 9: Fitur Lanjutan & Penyempurnaan API</option>
                            <option value="10">Pertemuan 10: Final Project</option>
                        </select>
                        <button class="btn btn-theme-toggle rounded-circle flex-shrink-0" title="Ubah Mode Gelap / Terang" aria-label="Toggle theme">

                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header Banner -->
    <div class="hero-section text-center">
        <div class="container">
            <span class="badge bg-primary fs-6 mb-3 px-3 py-2 rounded-pill" id="heroBadge">Pertemuan 1</span>
            <h1 class="display-4 fw-bold text-white mb-3" id="heroTitle">Recap Setup & Dasar PHP</h1>
            <p class="lead text-light-50 mx-auto" id="heroSubtitle" style="max-width: 650px;">
                Review tentang instalasi local server Laragon, sintaks dasar PHP, penggunaan variabel, output, array, serta perulangan sederhana.
            </p>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">
                <div id="contentArea" class="content-wrapper">
                    <!-- Content injected via JS -->
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 text-light-50 border-top border-secondary mt-5">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
            <p class="mb-0">© 2026 BPROTIC - Divisi Web Development</p>
            <div>
                <a href="../mobile/index.html" class="text-info text-decoration-none small me-3"><i class="bi bi-phone me-1"></i>Track Mobile</a>
                <a href="../index.html" class="text-secondary text-decoration-none small"><i class="bi bi-grid me-1"></i>Portal Silabus</a>
            </div>
        </div>
    </footer>  

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/php.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Data & Web Engine -->
    <script src="data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const weekSelector = document.getElementById("weekSelector");
            let activeWeek = "1";
            
            // Initial Render
            renderWebContent("1");

            weekSelector.addEventListener("change", (e) => {
                const val = e.target.value;
                const weekInfo = courseData[val];
                
                if (weekInfo && weekInfo.content) {
                    activeWeek = val;
                    renderWebContent(val);
                } else {
                    const weekTitle = weekInfo ? weekInfo.title : `Pertemuan ${val}`;
                    const weekSub = weekInfo ? weekInfo.subtitle : 'Materi sedang dalam proses penyusunan.';
                    
                    Swal.fire({
                        icon: 'info',
                        title: 'Segera Hadir!',
                        html: `Materi untuk <b>Pertemuan ${val}: ${weekTitle}</b> sedang dalam proses penyusunan.<br><br><span class="text-info">${weekSub}</span><br><br>Stay tuned!`,
                        confirmButtonText: 'Oke, Mengerti',
                        confirmButtonColor: '#38bdf8',
                        background: '#1e293b',
                        color: '#f8fafc',
                        showClass: {
                            popup: 'animate__animated animate__zoomIn'
                        },
                        hideClass: {
                            popup: 'animate__animated animate__zoomOut'
                        }
                    });
                    
                    weekSelector.value = activeWeek;
                }
            });
        });

        function renderWebContent(weekId) {
            const data = courseData[weekId];
            if (!data) return;

            // Update Header
            document.getElementById("heroBadge").textContent = `Pertemuan ${weekId}`;
            document.getElementById("heroTitle").textContent = data.title;
            if (document.getElementById("heroSubtitle")) {
                if (data.subtitle) {
                    document.getElementById("heroSubtitle").textContent = data.subtitle;
                } else if (weekId === "1") {
                    document.getElementById("heroSubtitle").textContent = "Review tentang instalasi local server Laragon, sintaks dasar PHP, penggunaan variabel, output, array, serta perulangan sederhana.";
                } else if (weekId === "2") {
                    document.getElementById("heroSubtitle").textContent = "Praktik pembuatan Form input HTML, $_POST, if/else, validasi, integrasi database MySQL via phpMyAdmin, dan operasi CRUD dasar.";
                }
            }
            
            // Update Content dengan animasi fade
            const contentArea = document.getElementById("contentArea");
            contentArea.style.opacity = 0;
            
            setTimeout(() => {
                contentArea.innerHTML = data.content;
                
                // Highlight code blocks
                document.querySelectorAll('pre code').forEach((block) => {
                    let lines = block.innerHTML.split('\n');
                    let minIndent = Infinity;
                    lines.forEach(l => {
                        if(l.trim().length > 0 && !l.trim().startsWith('&lt;?php')) {
                            let m = l.match(/^\s*/);
                            if(m) minIndent = Math.min(minIndent, m[0].length);
                        }
                    });
                    if (minIndent !== Infinity && minIndent > 0) {
                        block.innerHTML = lines.map(l => {
                            if(l.trim() === '&lt;?php' || l.trim() === '?&gt;') return l.trim();
                            return l.startsWith(' '.repeat(minIndent)) ? l.substring(minIndent) : l;
                        }).join('\n');
                    }
                    hljs.highlightElement(block);
                });
                
                contentArea.style.opacity = 1;
                contentArea.style.transition = "opacity 0.4s ease-in-out";
            }, 180);
        }
    </script>
</body>
</html>
